<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <!-- Viewport. `viewport-fit=cover` MOET hier staan en niet pas via JavaScript:
       iOS berekent env(safe-area-inset-*) alleen bij het laden van de pagina.
       Zetten we het achteraf, dan blijven alle insets 0px en loopt de statusbalk
       door de koptekst heen. Op het web verandert dit niets — buiten een notch
       zijn de insets toch 0px. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Fonts: Inter + Playfair Display zitten in de bundel (zie src/index.js).
       Geen CDN, zodat de app ook offline in huisstijl blijft. -->

  <!-- Title & Branding -->
  <title>TOF Persona Tool — The Office Factory</title>
  <meta name="description" content="Ontdek hoe jij werkt en wat jouw team nodig heeft om beter samen te werken." />

</head>

<body>
  <noscript>Je moet JavaScript inschakelen om deze app te gebruiken.</noscript>

  <div id="root"></div>

</body>

</html>
